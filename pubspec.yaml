name: kamaae
description: Inventory barcode scanning MVP
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_barcode_scanning: ^0.12.0
  google_mlkit_commons: ^0.8.1
  sqflite: ^2.3.0
  path: ^1.8.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  fl_chart: ^0.69.0
  camera: ^0.10.5+9
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.0
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#0D9488"
  image: assets/images/kamaae_splash_logo.png
  android_12:
    color: "#0D9488"
    image: assets/images/kamaae_splash_logo.png
  android: true
  ios: false
  web: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/kamaae_splash_logo.png
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: assets/images/kamaae_splash_logo.png
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    - assets/images/kamaae_splash_logo.png
