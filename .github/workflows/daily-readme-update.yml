name: Daily README Update

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with today's date
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          LINE="Repo was updated automatically on $DATE"

          # Remove any previous auto-update line, then append the new one
          grep -v "^Repo was updated automatically on" README.md > README.tmp
          echo "$LINE" >> README.tmp
          mv README.tmp README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: daily README update [skip ci]"
          git push
