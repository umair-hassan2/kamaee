name: Daily README Update

on:
  schedule:
    # Twice a day — Mon, Tue, Fri (08:00 UTC = 1 PM PKT, 20:00 UTC = 1 AM PKT)
    - cron: '0 8 * * 1,2,5'
    - cron: '0 20 * * 1,2,5'
    # Thrice a day — Wed, Thu, Sat, Sun (06:00 UTC = 11 AM PKT, 13:00 UTC = 6 PM PKT, 20:00 UTC = 1 AM PKT)
    - cron: '0 6 * * 0,3,4,6'
    - cron: '0 13 * * 0,3,4,6'
    - cron: '0 20 * * 0,3,4,6'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with today's date
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          LINE="Repo was updated automatically on $DATE [GH Actions]"

          # Remove any previous auto-update line, then append the new one
          grep -v "^Repo was updated automatically on" README.md > README.tmp
          echo "$LINE" >> README.tmp
          mv README.tmp README.md

      - name: Commit and push
        run: |
          git config user.name "Umair Hassan"
          git config user.email "umairpu24@gmail.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: daily README update [skip ci]"
          git push
